name: CI

on:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for Prism)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Make scripts executable
        run: chmod +x test.sh test_unit.sh test_integration.sh

      # - name: Run tests
      #   run: ./test.sh
