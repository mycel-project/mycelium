name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-prerelease:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Check prerelease
        id: check
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta"* ]] || [[ "${{ github.ref_name }}" == *"-rc"* ]] || [[ "${{ github.ref_name }}" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          sed -i "s/^version: .*/version: $VERSION_NUMBER+${{ github.run_number }}/" pubspec.yaml

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ github.workspace }}/android/upload-keystore.jks" >> android/key.properties

      - name: Validate keystore
        run: |
          keytool -list \
          -keystore android/upload-keystore.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -alias "${{ secrets.KEY_ALIAS }}" || exit 1

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mycelium-android-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/mycelium-android-${{ github.ref_name }}.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        run: |
          $VERSION="${{ github.ref_name }}".TrimStart('v')
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $VERSION+${{ github.run_number }}" | Set-Content pubspec.yaml

      - name: Build Windows
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Zip bundle
        run: |
          $VERSION="${{ github.ref_name }}"
          New-Item -ItemType Directory -Path "mycelium-$VERSION"
          Copy-Item -Path build/windows/x64/runner/Release/* -Destination "mycelium-$VERSION" -Recurse
          Compress-Archive -Path "mycelium-$VERSION" -DestinationPath mycelium-windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: mycelium-windows-${{ github.ref_name }}.zip

  build-web:
    needs: [check-prerelease, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - run: flutter pub get

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          sed -i "s/^version: .*/version: $VERSION_NUMBER+${{ github.run_number }}/" pubspec.yaml

      - run: flutter build web --base-href=/

      - name: Zip web bundle
        run: |
          cd build/web
          zip -r ../../mycelium-web-${{ github.ref_name }}.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: mycelium-web-${{ github.ref_name }}.zip

      - name: Deploy to live-mycelium
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPLOY_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const OWNER = 'mycel-project';
            const REPO = 'live-mycelium';
            const BUILD = 'build/web';
            const PRESERVE = ['app-status.json', 'overlay-script.html', 'CNAME'];
            const USER = { name: 'mycel-bot', email: 'bot@mycel-project.com' };

            function walk(dir) {
              const files = [];
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) files.push(...walk(p)); else files.push(p);
              }
              return files;
            }

            // 1. Get current ref (handle empty repo)
            let parentSha = null;
            let preserved = [];
            try {
              const { data: ref } = await github.rest.git.getRef({ owner: OWNER, repo: REPO, ref: 'heads/main' });
              parentSha = ref.object.sha;
              const { data: c } = await github.rest.git.getCommit({ owner: OWNER, repo: REPO, commit_sha: parentSha });
              const { data: t } = await github.rest.git.getTree({ owner: OWNER, repo: REPO, tree_sha: c.tree.sha, recursive: 1 });
              preserved = t.tree.filter(f => PRESERVE.includes(f.path));
              core.info(`preserving ${preserved.length} file(s)`);
            } catch (e) {
              if (e.status === 404) core.info('no existing branch — initial commit');
              else throw e;
            }

            // 2. Build tree: preserved files + CNAME fallback + build blobs
            const cnameEntry = preserved.find(f => f.path === 'CNAME');
            if (!cnameEntry) {
              const { data: blob } = await github.rest.git.createBlob({
                owner: OWNER, repo: REPO,
                content: Buffer.from('app.mycel-project.com').toString('base64'),
                encoding: 'base64'
              });
              preserved.push({ path: 'CNAME', mode: '100644', type: 'blob', sha: blob.sha });
              core.info('created CNAME fallback');
            }
            const items = preserved.map(f => ({ path: f.path, mode: f.mode, type: f.type, sha: f.sha }));
            const overlay = preserved.find(f => f.path === 'overlay-script.html');
            const buildFiles = walk(BUILD);
            core.info(`uploading ${buildFiles.length} file(s)`);

            for (const fp of buildFiles) {
              const rel = path.relative(BUILD, fp);

              // Inject overlay into index.html
              if (rel === 'index.html' && overlay) {
                const { data: ob } = await github.rest.git.getBlob({ owner: OWNER, repo: REPO, file_sha: overlay.sha });
                const injected = Buffer.from(ob.content, 'base64').toString().trim();
                if (injected) {
                  fs.writeFileSync(fp, fs.readFileSync(fp, 'utf-8').replace('</body>', injected + '\n</body>'), 'utf-8');
                  core.info('injected overlay-script.html');
                }
              }

              const { data: blob } = await github.rest.git.createBlob({
                owner: OWNER, repo: REPO, content: fs.readFileSync(fp).toString('base64'), encoding: 'base64'
              });
              items.push({ path: rel, mode: '100644', type: 'blob', sha: blob.sha });
            }

            // 3. Create tree + commit + ref
            const { data: tree } = await github.rest.git.createTree({ owner: OWNER, repo: REPO, tree: items });
            const { data: commit } = await github.rest.git.createCommit({
              owner: OWNER, repo: REPO,
              message: `deploy ${new Date().toISOString().slice(0, 10)}`,
              tree: tree.sha,
              parents: parentSha ? [parentSha] : [],
              author: USER, committer: USER,
            });

            if (parentSha) {
              await github.rest.git.updateRef({ owner: OWNER, repo: REPO, ref: 'heads/main', sha: commit.sha, force: true });
            } else {
              await github.rest.git.createRef({ owner: OWNER, repo: REPO, ref: 'refs/heads/main', sha: commit.sha });
            }
            core.info(`deployed: ${commit.sha}`);

            // 5. Ensure GitHub Pages custom domain
            try {
              await github.rest.repos.updatePagesConfiguration({
                owner: OWNER, repo: REPO,
                source: { branch: 'main', path: '/' },
                cname: 'app.mycel-project.com',
              });
              core.info('GitHub Pages configured');
            } catch (e) {
              core.warning(`pages config: ${e.message}`);
            }

  release:
    needs: [check-prerelease, build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract changelog
        run: |
          VERSION=${{ github.ref_name }}
          awk "/## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md | tr -d '\r' > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check-prerelease.outputs.is_prerelease }}
          body_path: release_notes.md
          files: |
            windows-bundle/mycelium-windows-${{ github.ref_name }}.zip
            android-apk/mycelium-android-${{ github.ref_name }}.apk
            web-bundle/mycelium-web-${{ github.ref_name }}.zip
