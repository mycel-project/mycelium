name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-prerelease:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Check prerelease
        id: check
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta"* ]] || [[ "${{ github.ref_name }}" == *"-rc"* ]] || [[ "${{ github.ref_name }}" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          sed -i "s/^version: .*/version: $VERSION_NUMBER+${{ github.run_number }}/" pubspec.yaml

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ github.workspace }}/android/upload-keystore.jks" >> android/key.properties

      - name: Validate keystore
        run: |
          keytool -list \
          -keystore android/upload-keystore.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -alias "${{ secrets.KEY_ALIAS }}" || exit 1

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mycelium-android-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/mycelium-android-${{ github.ref_name }}.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        run: |
          $VERSION="${{ github.ref_name }}".TrimStart('v')
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $VERSION+${{ github.run_number }}" | Set-Content pubspec.yaml

      - name: Build Windows
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Zip bundle
        run: |
          $VERSION="${{ github.ref_name }}"
          New-Item -ItemType Directory -Path "mycelium-$VERSION"
          Copy-Item -Path build/windows/x64/runner/Release/* -Destination "mycelium-$VERSION" -Recurse
          Compress-Archive -Path "mycelium-$VERSION" -DestinationPath mycelium-windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: mycelium-windows-${{ github.ref_name }}.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev fuse libfuse2
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          flutter pub get

      - name: Set version
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          sed -i "s/^version: .*/version: $VERSION_NUMBER+${{ github.run_number }}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=$VERSION_NUMBER

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          cat > AppDir/AppRun << 'EOF2'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/Mycelium" "$@"
          EOF2
          chmod +x AppDir/AppRun

          cat > AppDir/mycelium.desktop << 'EOF2'
          [Desktop Entry]
          Name=Mycelium
          Exec=Mycelium
          Icon=mycelium
          Type=Application
          Categories=Education;
          EOF2

          cp assets/full.png AppDir/mycelium.png
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/
          cp assets/full.png AppDir/usr/share/icons/hicolor/256x256/apps/mycelium.png
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --verbose AppDir mycelium-linux-${{ github.ref_name }}.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: mycelium-linux-${{ github.ref_name }}.AppImage

  release:
    needs: [check-prerelease, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract changelog
        run: |
          VERSION=${{ github.ref_name }}
          awk "/## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md | tr -d '\r' > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check-prerelease.outputs.is_prerelease }}
          body_path: release_notes.md
          files: |
            windows-bundle/mycelium-windows-${{ github.ref_name }}.zip
            android-apk/mycelium-android-${{ github.ref_name }}.apk
            linux-bundle/mycelium-linux-${{ github.ref_name }}.AppImage
