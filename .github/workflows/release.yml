name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

        
      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=${{ github.workspace }}/android/upload-keystore.jks" >> android/key.properties

      - name: Validate keystore
        run: |
          keytool -list \
          -keystore android/upload-keystore.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -alias "${{ secrets.KEY_ALIAS }}" || exit 1

      - name: Build APK
        run: |
          VERSION=${{ github.ref_name }}          
          VERSION_NUMBER=${VERSION#v}             
          flutter build apk --release \
          --build-name=$VERSION_NUMBER \
          --build-number=${{ github.run_number }}
          
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/mycelium-android-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/mycelium-android-${{ github.ref_name }}.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: |
          $VERSION="${{ github.ref_name }}".TrimStart('v')
          flutter config --enable-windows-desktop
          flutter build windows --release --build-name=$VERSION
      - name: Zip bundle
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mycelium-windows-${{ github.ref_name }}.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: mycelium-windows-${{ github.ref_name }}.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev fuse libfuse2
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          flutter pub get

      - name: Build Linux
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=$VERSION_NUMBER
          
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
              
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/mycelium" "$@"
          EOF
          chmod +x AppDir/AppRun
              
          cat > AppDir/mycelium.desktop << 'EOF'
          [Desktop Entry]
          Name=Mycelium
          Exec=mycelium
          Icon=mycelium
          Type=Application
          Categories=Utility;
          EOF
              
          cp assets/full.png AppDir/mycelium.png
          
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir mycelium-linux-${{ github.ref_name }}.AppImage

          
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: mycelium-linux-${{ github.ref_name }}.AppImage
    
  release:
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract changelog
        run: |
          VERSION=${{ github.ref_name }}
          awk "/## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md | tr -d '\r' > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body_path: release_notes.md
          files: |
            windows-bundle/mycelium-windows-${{ github.ref_name }}.zip
            android-apk/mycelium-android-${{ github.ref_name }}.apk
            linux-bundle/mycelium-linux-${{ github.ref_name }}.AppImage
